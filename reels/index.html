<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reels — Nexus en 30 secondes</title>
<link rel="canonical" href="https://nexusvie.com/reels/">
<link rel="alternate" hreflang="fr" href="https://nexusvie.com/reels/">
<link rel="alternate" hreflang="en" href="https://nexusvie.com/en/reels/">
<meta name="description" content="Les méditations de Nexus en 30 secondes : un verset, quelques phrases, une voix.">
<meta property="og:type" content="website">
<meta property="og:title" content="Reels — Nexus en 30 secondes">
<meta property="og:description" content="Les méditations de Nexus en 30 secondes : un verset, quelques phrases, une voix.">
<meta property="og:image" content="https://nexusvie.com/assets/reels/ce-qui-demeure.jpg">
<meta property="og:url" content="https://nexusvie.com/reels/">
<meta name="theme-color" content="#0D0D0D">
<link rel="icon" href="/brand/nexus-logo-transparent.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --black:#090909; --ink:#F5F0E8; --soft:#C3B6AA; --faint:#A39688; --gold:#D3B078; --burgundy:#A52D42; --rule:#38302F; }
  * { box-sizing:border-box; }
  html { background:var(--black); }
  body { margin:0; background:var(--black); color:var(--ink); font:16px/1.75 'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1040px; padding:36px 48px 78px; margin:auto; }
  header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding-bottom:34px; border-bottom:1px solid var(--rule); }
  .logo { display:inline-flex; align-items:center; }
  .logo img { display:block; width:auto; height:51px; }
  .links { display:flex; gap:22px; align-items:center; }
  .back, .return { color:var(--gold); text-decoration:none; font:300 14px/1.3 'Josefin Sans',sans-serif; letter-spacing:.13em; }
  .back:hover,.return:hover,.reel-more:hover { text-decoration:underline; text-underline-offset:5px; }
  main { margin:80px auto 0; }
  .eyebrow { display:flex; align-items:center; gap:14px; color:var(--gold); font:300 12px/1.2 'Josefin Sans',sans-serif; text-transform:uppercase; letter-spacing:.24em; }
  .eyebrow::before { content:''; width:38px; height:2px; background:var(--burgundy); }
  h1 { margin:28px 0 14px; font:200 clamp(48px,7vw,80px)/1.05 'Josefin Sans',sans-serif; letter-spacing:-.02em; }
  .lede { color:var(--soft); max-width:560px; margin:0; font-size:17px; }
  .reels { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,300px)); gap:36px; margin-top:60px; }
  .reel-card { margin:0; scroll-margin-top:30px; }
  .reel-card video { display:block; width:100%; aspect-ratio:9/16; height:auto; background:#000; border-radius:14px; border:1px solid var(--rule); }
  .reel-kicker { margin-top:18px; color:var(--faint); font:300 11px/1.3 'Josefin Sans',sans-serif; text-transform:uppercase; letter-spacing:.2em; }
  .reel-title { margin:8px 0 4px; font:300 26px/1.2 'Josefin Sans',sans-serif; color:var(--ink); }
  .reel-teaser { margin:0 0 10px; color:var(--soft); font-size:14px; line-height:1.6; }
  .reel-more { color:var(--gold); text-decoration:none; font:300 13px/1.3 'Josefin Sans',sans-serif; letter-spacing:.12em; }
  footer { margin:88px auto 0; padding-top:25px; border-top:1px solid var(--rule); display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; color:var(--faint); font:300 13px/1.4 'Josefin Sans',sans-serif; letter-spacing:.12em; }
  @media(max-width:640px){.wrap{padding:26px 22px 55px}.logo img{height:38px}main{margin-top:60px}.reels{grid-template-columns:1fr;justify-items:center}.reel-card{width:100%;max-width:360px}footer{margin-top:70px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/" aria-label="Nexus"><img src="/brand/nexus-logo-transparent.png" alt="Nexus"></a>
    <span class="links"><a class="back" href="/en/reels/" lang="en">EN</a><a class="back" href="/">← accueil</a></span>
  </header>
  <main>
    <div class="eyebrow">Reels</div>
    <h1>Nexus en 30 secondes</h1>
    <p class="lede">Les méditations de Nexus en 30 secondes : un verset, quelques phrases, une voix.</p>
    <section class="reels">
      <!-- Newest first. To add a reel, copy one <article class="reel-card"> block (video in /assets/reels/ID.mp4 + ID.jpg). -->
      <!-- reel: ce-qui-demeure -->
      <article class="reel-card" id="ce-qui-demeure">
        <video controls playsinline preload="none" poster="/assets/reels/ce-qui-demeure.jpg" aria-label="Reel vidéo de la méditation Ce qui demeure">
          <source src="/assets/reels/ce-qui-demeure.mp4" type="video/mp4">
        </video>
        <div class="reel-kicker">Méditation 02 · 1 Jean 2,17</div>
        <h2 class="reel-title">Ce qui demeure</h2>
        <p class="reel-teaser">Les royaumes passent. La paix de Dieu demeure.</p>
        <a class="reel-more" href="/meditations/ce-qui-demeure/">lire la méditation complète →</a>
      </article>
    </section>
  </main>
  <footer><span>Cornel Serban · Nexus</span><span>québec</span></footer>
</div>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "e0078313a72947b39234dbed87ed9e4c"}'></script>
</body>
</html>
